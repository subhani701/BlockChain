# The Graph manifest for ProductRegistry (Phase 6.2). Set `address` + `startBlock`
# to your deployed contract before `graph build && graph deploy`.
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProductRegistry
    network: mainnet # change to your network (or the VoltusWave private chain)
    source:
      address: "0x0000000000000000000000000000000000000000" # <-- deployed address
      abi: ProductRegistry
      startBlock: 0 # <-- deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Batch, BatchVersion, Verification]
      abis:
        - name: ProductRegistry
          # Reuse the Truffle-generated ABI.
          file: ../build/contracts/ProductRegistry.json
      eventHandlers:
        - event: "BatchRegistered(indexed string,bytes32,uint256,uint256)"
          handler: handleBatchRegistered
        - event: "BatchSuperseded(indexed string,bytes32,bytes32,uint256,uint256)"
          handler: handleBatchSuperseded
        - event: "ProductVerified(indexed string,bytes32,bool)"
          handler: handleProductVerified
      file: ./src/mapping.ts
